# Security headers for every panel response. Included in each `location` of nginx.conf, because
# an `add_header` inside a location drops every add_header inherited from the server block.

# The panel loads only its own files and calls only /api on the same origin. The one inline
# script is the theme/language boot script in index.html, allowed by its hash: if you edit it,
# update the hash (src/app/csp.test.ts fails and prints the new one).
# Uploaded files and avatars come from /media on the same domain; add a CDN host to img-src if
# that ever changes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-iTpVaUF6eQNOZ1U5GyeurvF1ZS29aAhNNYLs1/1LSok='; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
