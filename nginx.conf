# Serves the built panel under /panel/. The site's main nginx (scorize repo) proxies
# /panel/ here and everything else (/api, /profile, /static, ...) to Django.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip_static on;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /panel/healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed file names never change content: cache for a year.
    location /panel/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Must always be re-checked, or users get stuck on an old version.
    location ~ ^/panel/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Client-side routes: every unknown path under /panel/ gets the app shell.
    location /panel/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files $uri /panel/index.html;
    }

    location = /panel {
        return 301 /panel/;
    }
}
